# $schema: https://www.schemastore.org/github-workflow.json
name: zizmor

on:
  pull_request:
    branches: ["*"]
    paths: [.github/workflows/*.yml, .github/zizmor.yml]
  push:
    branches: ["*"]
    tags-ignore: [v*]
    paths: [.github/workflows/*.yml, .github/zizmor.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.5.6
        with:
          advanced-security: false

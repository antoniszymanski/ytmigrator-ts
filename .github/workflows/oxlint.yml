name: oxlint

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]
    tags-ignore: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install

      - name: Run oxlint
        run: bun run oxlint --format=github

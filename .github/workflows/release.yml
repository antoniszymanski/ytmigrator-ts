name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux-x64-modern
          - windows-x64-modern
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run tsc --noEmit

      - name: Compile
        run: bun run build.ts build --target bun-${{ matrix.target }}

      - name: Archive
        run: |
          tar -acf \
            dist/ytmigrator-${{ matrix.target }}.tar.gz \
            -C dist \
            dist/ytmigrator${{ case(startsWith(matrix.target, 'windows'), '.exe', '') }}

      - name: Upload
        run: gh release upload ${GITHUB_REF_NAME} dist/ytmigrator-${{ matrix.target }}.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
